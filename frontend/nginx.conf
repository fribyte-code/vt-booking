# Serves the built SPA and proxies the API, so the browser sees one origin:
# the session and XSRF-TOKEN cookies are first-party and no CORS is needed.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # The client address. Nginx is the only way into the API, so it alone decides which address
    # the API sees (the login throttle counts failures per address): the TCP peer ($remote_addr).
    # Behind a reverse proxy, compose.prod.yaml adds real-ip.conf.template, which makes Nginx take
    # the client address from the proxy's header, for requests from that proxy only.

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # One address, chosen above. Whatever the client sent in X-Forwarded-For is dropped.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset file names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes (/admin, /mine-bookinger) fall back to index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
