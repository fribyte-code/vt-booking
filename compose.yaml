# Local stack for trying the complete application: `make up`, then http://localhost:8088.
# NOT a production setup: the backend runs with the "dev" profile (default database password,
# plain-http cookies). There is no seed data or development login: create the first administrator
# with `make bootstrap-admin`, which runs `bootstrap-admin` in a one-off backend container.
name: vt-booking

include:
  - backend/compose.yaml # PostgreSQL ("db"), also used on its own by `make dev`

services:
  backend:
    build: backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/booking
      DB_PASSWORD: ${DB_PASSWORD:-booking-dev}
    depends_on:
      db:
        condition: service_healthy
    # No published port: the browser reaches the API through Nginx only.

  frontend:
    build: frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    depends_on:
      - backend
