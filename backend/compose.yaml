# Local development database. Not for production.
# The port is bound to 127.0.0.1 only, so PostgreSQL is not reachable from the network.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking-dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
