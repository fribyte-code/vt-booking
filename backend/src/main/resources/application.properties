spring.application.name=booking-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USER:booking}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Sessions expire after 8 hours without activity (docs/ARCHITECTURE.md §4).
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never

# Behind Nginx (or the Vite dev proxy): take the client IP from X-Forwarded-For when the request
# comes from a private-network proxy, so login throttling sees real client addresses.
server.forward-headers-strategy=native
