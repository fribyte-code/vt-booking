spring.application.name=booking-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USER:booking}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Sessions expire after 8 hours without activity.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never

# Client address for the login throttle. Tomcat takes it from X-Forwarded-For only when the
# request comes from a private-network peer (its default internal proxies). Nginx is that peer,
# and it sends a single address it chose itself (frontend/nginx.conf), so clients can't pick one.
# The API port must therefore only be reachable through Nginx: never publish it. (The Vite dev
# proxy passes client headers through unchanged; it is for local development only.)
server.forward-headers-strategy=native

# Local time zone for weekly series: occurrences keep their wall-clock time across DST.
booking.time-zone=Europe/Oslo
