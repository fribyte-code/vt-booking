spring.application.name=booking-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USER:booking}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never

# Development-only login with predefined users. Never enable outside local development.
app.dev-auth.enabled=false
app.dev-auth.password=
