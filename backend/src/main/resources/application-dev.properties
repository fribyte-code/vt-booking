# Local development: seed data and predefined users with a shared password.
spring.datasource.password=${DB_PASSWORD:booking-dev}
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Plain http://localhost in development.
server.servlet.session.cookie.secure=false

app.dev-auth.enabled=true
app.dev-auth.password=${DEV_AUTH_PASSWORD:dev}
